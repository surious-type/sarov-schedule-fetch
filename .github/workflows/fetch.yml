name: Fetch Sarov schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "fetch_schedule.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/fetch.yml"

permissions:
  contents: read

concurrency:
  group: sarov-schedule-fetch
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser tests
        run: |
          . .venv/bin/activate
          python -m unittest discover -s tests -v

      - name: Fetch live schedule
        run: |
          . .venv/bin/activate
          python fetch_schedule.py

      - name: Upload short-lived artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarov-schedule
          path: output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
