name: Test GitHub-hosted fetch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-github-hosted.yml"
      - "fetch_schedule.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live schedule from sarov.msu.ru
        run: |
          . .venv/bin/activate
          python fetch_schedule.py

      - name: Show manifest summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("pdf_count:", data.get("pdf_count"))
          print("fetched_at:", data.get("fetched_at"))
          for f in data.get("files", []):
              print(f["file"], f["size_bytes"], f["source_url"])
          PY

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarov-schedule-github-test
          path: output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
